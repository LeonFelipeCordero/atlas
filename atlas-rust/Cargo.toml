[package]
name = "atlas-rust"
version = "0.1.0"
edition = "2024"
description = "Native Rust implementation of the Atlas repository importer"
license = "MIT"

[lib]
name = "atlas"
path = "src/atlas/lib.rs"

[[bin]]
name = "atlas"
path = "src/atlas/main.rs"

[[bin]]
name = "atlas-migrate"
path = "src/atlas/migrate.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "chrono", "32-column-tables"] }
getrandom = "0.4"
libc = "0.2"
base64 = "0.22"
indexmap = { version = "2", features = ["serde"] }
tempfile = "3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "arbitrary_precision"] }
sha2 = "0.10"
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-language-pack = { version = "=1.20.0", features = ["serde"] }
unicode_names2 = "=1.3.0"

[profile.release]
lto = "thin"
strip = true
