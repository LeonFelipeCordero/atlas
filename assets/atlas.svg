    <path d="M221 302 Q232 314 241 308 Q255 300 269 308 Q280 314 292 302 L291 316 Q281 340 256 344 Q231 340 221 316 Z" fill="#443447" stroke-width="6"/>
    <path d="M247 318 Q256 324 265 318" fill="none" stroke="#f0c298" stroke-width="5"/>
