<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Atlas</title>
  <desc id="desc">A friendly cartoon giant kneels with a teal world resting on his raised hands and shoulders.</desc>
  <defs>
    <clipPath id="globe"><circle cx="256" cy="151" r="112"/></clipPath>
