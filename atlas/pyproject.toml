[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.1.0"
description = "Index source repositories into portable code graph artifacts"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.15,<2",
    "click>=8.5.0",
    "pathspec>=0.12.1",
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0,<3",
    "typing-extensions>=4.15",
    "tree-sitter-language-pack==1.20.0",
    # Language pack 1.20 grammars crash with the 0.26 Python binding.
    "tree-sitter>=0.25,<0.26",
]

[project.scripts]
atlas = "atlas.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.414",
    "ruff>=0.16.9",
]

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
