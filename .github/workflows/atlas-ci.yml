name: Atlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: atlas-rust
      - run: cargo build --manifest-path atlas-rust/Cargo.toml --release --locked --bins
      - name: Require all configured checks to pass across the entire repository
        shell: bash
        run: |
          set -o pipefail
          atlas-rust/target/release/atlas check --f . --format json | tee "$RUNNER_TEMP/atlas-check.json"
