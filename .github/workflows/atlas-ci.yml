name: Atlas CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: atlas/pyproject.toml
          python-version: "3.14"
      - run: uv sync --project atlas --no-dev
      - name: Require all configured checks to pass across the entire repository
        shell: bash
        run: |
          set -o pipefail
          uv run --project atlas --no-dev atlas check --f . --format json | tee "$RUNNER_TEMP/atlas-check.json"
