name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: atlas/pyproject.toml
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run pyright
      - run: uv run ruff check .

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: atlas/pyproject.toml
          python-version: "3.14"
      - run: uv sync --project ../atlas --no-dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.1"
      - run: bun install --no-save
      - run: bun run build
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint

  atlas:
    name: Atlas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: atlas/pyproject.toml
          python-version: "3.14"
      - run: uv sync --project atlas --no-dev
      - name: Require zero findings across the entire repository
        shell: bash
        run: |
          uv run --project atlas --no-dev atlas report --f . --skip-save --format json | tee "$RUNNER_TEMP/atlas-report.json"
          jq -e '.findings == []' "$RUNNER_TEMP/atlas-report.json"
