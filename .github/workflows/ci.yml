name: CLI CI

on:
  pull_request:
    branches: [main]
    paths:
      - atlas/**
      - .github/workflows/ci.yml
  push:
    branches: [main]
    paths:
      - atlas/**
      - .github/workflows/ci.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atlas
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: atlas/pyproject.toml
          python-version: "3.14"
      - run: uv sync --group dev
      - run: uv run pytest -n auto
      - run: uv run pyright
      - run: uv run ruff check .
